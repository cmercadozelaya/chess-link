<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Link Chess</title>

<!--
  These three lines load code that other people already wrote, so we don't have
  to write a chess "rulebook" or a live-sync system ourselves:
    1. chess.js         -> knows the rules of chess (legal moves, check, checkmate, etc.)
    2 & 3. firebase      -> a free online database that instantly sends updates to
                            everyone looking at the same game, so both players see
                            moves show up without refreshing the page.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<!--
  ============================================================
  STYLE SHEET (the "look" of the page)
  ============================================================
  Everything between <style> and </style> only controls appearance -
  colors, sizes, spacing. It never decides what happens when you click
  something; that's all down in the <script> section near the bottom.
-->
<style>
  /* Named colors we reuse everywhere, like a paint palette. Changing a value
     here changes it everywhere that color is used on the page. */
  :root {
    --light: #f0d9b5;      /* color of the light squares */
    --dark: #6b8f5e;       /* color of the dark (green) squares */
    --highlight: #f6f669;  /* outline around the square you picked up a piece from */
    --move-dot: rgba(20, 60, 30, 0.55);   /* the small dots showing where a piece can legally move */
    --last-move: rgba(240, 193, 75, 0.35); /* soft highlight on the two squares of the last move made */
    --felt: #0f3d24;        /* dark green background color, like a card table */
    --felt-light: #145530;  /* lighter green, used for a subtle glow effect behind the board */
    --panel: #124a2c;       /* background color of the info boxes (status, link box, history, etc.) */
    --panel-border: #2c6b45;/* thin border color around those info boxes */
    --gold: #e0b24a;        /* gold accent color, used for the board's frame and buttons */
    --gold-light: #f0cd7a;  /* lighter gold, used for hover effects and important text */
    --cream: #f2e9d8;       /* main text color (an off-white, easy to read on dark green) */
    --ink-muted: #b9d2c2;   /* dimmer text color, used for less important labels */
  }
  * { box-sizing: border-box; } /* a technical CSS default that makes sizing behave predictably */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; /* use whatever clean font the visitor's device already has */
    background: radial-gradient(ellipse at top, var(--felt-light) 0%, var(--felt) 55%, #082416 100%); /* the green "felt table" background */
    color: var(--cream);
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center; /* keeps everything centered horizontally on the page */
    min-height: 100vh;   /* page always fills at least the full height of the screen */
  }
  h1 { font-size: 1.3rem; margin: 0 0 12px; color: var(--gold-light); font-weight: 600; letter-spacing: 0.02em; }
  a { color: var(--gold-light); }

  /* .layout holds the board on the left and the info panel on the right (or stacked, on narrow screens) */
  .layout {
    display: flex;
    gap: 24px;
    flex-wrap: wrap; /* if the screen is too narrow, the panel drops below the board instead of squishing */
    justify-content: center;
    align-items: flex-start;
  }

  /* #board-wrap is the square container that holds the chessboard itself */
  #board-wrap {
    position: relative;
    width: min(94vw, 680px);  /* board is 680px on a big screen, but shrinks on small/phone screens */
    height: min(94vw, 680px); /* always kept exactly square, matching the width */
    user-select: none;   /* stops the browser from letting you "select" the board text like a Word document */
    touch-action: none;  /* helps dragging work smoothly on touchscreens/phones */
  }

  /* #board is the 8x8 grid of squares */
  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr); /* 8 equal-width columns */
    grid-template-rows: repeat(8, 1fr);    /* 8 equal-height rows */
    width: 100%;
    height: 100%;
    border: 6px solid var(--gold);  /* the gold picture-frame border around the whole board */
    box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,0,0,0.3); /* subtle drop-shadow so the board looks like it's sitting above the table */
  }

  /* .square is one single square on the board (there are 64 of these, generated by the code below) */
  .square {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center; /* centers the piece glyph in the middle of the square */
  }
  .square.light { background: var(--light); }
  .square.dark { background: var(--dark); }
  .square.highlight { box-shadow: inset 0 0 0 4px var(--highlight); } /* the glowing outline on the square you're dragging from */
  .square.last-move { background-image: linear-gradient(var(--last-move), var(--last-move)); } /* tints the two squares involved in the most recent move */

  /* .dot is the small circle marker shown on squares a piece is allowed to move to */
  .square .dot {
    position: absolute;
    width: 24%;
    height: 24%;
    border-radius: 50%; /* makes it a circle instead of a square */
    background: var(--move-dot);
    pointer-events: none; /* lets clicks "pass through" the dot to the square underneath it */
  }
  /* .dot.capture is a bigger ring shown instead, on squares where moving there would capture an enemy piece */
  .square .dot.capture {
    width: 82%;
    height: 82%;
    background: transparent;
    border: 6px solid var(--move-dot);
    border-radius: 50%;
    box-sizing: border-box;
  }

  /* .coord are the tiny letter/number labels (a-h, 1-8) along the edge of the board */
  .coord {
    position: absolute;
    font-size: 0.6rem;
    color: rgba(0,0,0,0.45);
    pointer-events: none;
  }
  .coord.file { bottom: 2px; right: 4px; }  /* the a-h letters, bottom-right corner of each square in the bottom row */
  .coord.rank { top: 2px; left: 4px; }      /* the 1-8 numbers, top-left corner of each square in the left column */

  /* .piece is one chess piece symbol (they're actually just text characters, like ♔ or ♞, not image files) */
  .piece {
    font-size: min(11vw, 62px); /* pieces scale down on small screens, same idea as the board size above */
    line-height: 1;
    cursor: grab;   /* shows a "hand" cursor to hint that you can pick this up */
    position: relative;
    z-index: 2;     /* keeps pieces drawn on top of the square backgrounds and highlight dots */
  }
  .piece.white { color: #fff; text-shadow: 0 0 2px #000, 0 0 1px #000, 1px 1px 1px #000; } /* white pieces get a dark outline so they're visible on light squares too */
  .piece.black { color: #111; text-shadow: 0 0 2px #ccc; } /* black pieces get a light outline so they're visible on dark squares too */
  .piece.dragging { cursor: grabbing; opacity: 0.35; } /* the piece fades out while you're dragging it (the "ghost" copy below takes its place visually) */
  .piece.locked { cursor: default; } /* pieces you're not allowed to move (wrong turn / wrong color) show a plain cursor instead of the "hand" */

  /* #drag-ghost is the floating copy of a piece that follows your mouse/finger while dragging */
  #drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 999;
    font-size: min(11vw, 62px);
    transform: translate(-50%, -50%); /* centers the ghost piece exactly on the cursor position */
    display: none; /* hidden until a drag actually starts */
  }

  /* .panel is the whole right-hand column: status box, captured pieces, link box, buttons, and history */
  .panel {
    width: min(90vw, 340px);
    display: flex;
    flex-direction: column;
    gap: 12px; /* even spacing between each box in the panel */
  }

  /* .status is the box at the top of the panel that says whose turn it is / check / checkmate / etc. */
  .status {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.95rem;
    min-height: 3.2em; /* keeps a stable height so the layout doesn't jump around as the text changes */
  }
  .status b { color: var(--gold-light); } /* bold text inside the status box (like "Checkmate!") is shown in gold */

  /* .link-box is the box containing the shareable game link and the Copy button */
  .link-box {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .link-box label { display: block; font-size: 0.8rem; color: var(--ink-muted); margin-bottom: 6px; }
  .link-row { display: flex; gap: 6px; }
  .link-row input {
    flex: 1; /* the text box stretches to fill the space, leaving just enough room for the Copy button */
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--panel-border);
    background: #08200f;
    color: var(--cream);
    font-size: 0.8rem;
  }

  /* Buttons throughout the page. "secondary" and "danger" are alternate colorings for less-important
     or destructive actions (like Resign), so they visually stand out from the main gold buttons. */
  button {
    padding: 8px 12px;
    border-radius: 6px;
    border: none;
    background: var(--gold);
    color: #1a2e1f;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
  }
  button:hover { background: var(--gold-light); }
  button.secondary { background: #1c5a37; color: var(--cream); }
  button.secondary:hover { background: #216941; }
  button.danger { background: #7a3030; color: var(--cream); } /* used for the Resign button - reddish, to signal "careful" */
  button.danger:hover { background: #953a3a; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; } /* row(s) of buttons, wraps to a new line if the panel is narrow */

  /* .history is the box listing every move played so far, in standard chess notation (like "e4", "Nf3") */
  .history {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px 14px;
    max-height: 220px;
    overflow-y: auto; /* if the list gets long, it scrolls inside its box instead of growing forever */
    font-size: 0.85rem;
  }
  .history ol { margin: 0; padding-left: 20px; }
  .history li { margin-bottom: 2px; }

  /* .captured-box shows which enemy pieces each side has captured so far */
  .captured-box {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.85rem;
  }
  .captured-row { display: flex; align-items: center; gap: 6px; }
  .cap-label { color: var(--ink-muted); flex-shrink: 0; }
  .cap-pieces { font-size: 1.15rem; letter-spacing: 2px; }

  /* #promo-modal is the popup that appears when a pawn reaches the far end of the board and you
     have to choose what piece it turns into (Queen, Rook, Bishop, or Knight). It covers the whole
     screen with a dark overlay so you have to make a choice before continuing. */
  #promo-modal {
    position: fixed;
    inset: 0; /* stretches to cover the entire browser window */
    background: rgba(0,0,0,0.6); /* dims the rest of the page behind the popup */
    display: none; /* hidden unless a promotion choice is actually needed */
    align-items: center;
    justify-content: center;
    z-index: 1000; /* sits on top of absolutely everything else on the page */
  }
  #promo-modal .box {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 20px;
    border-radius: 10px;
    text-align: center;
  }
  #promo-modal .choices { display: flex; gap: 10px; margin-top: 10px; }
  #promo-modal button { font-size: 1.6rem; padding: 10px 14px; }
  .copied-msg { color: var(--gold-light); font-size: 0.8rem; } /* the little "Copied!" confirmation text after clicking Copy */
</style>
</head>
<body>
<h1>Link Chess — make a move, then send the link</h1>

<!--
  ============================================================
  PAGE CONTENT (the actual boxes, buttons, and text on screen)
  ============================================================
  There are two big sections below that are never both visible at once:
    1. #landing     -> shown before a game exists (just a "Start new game" button)
    2. #game-layout -> shown once a game is underway (the board + side panel)
  The script further down decides which one to show, based on whether the
  page's link already contains a game to join.
-->

<!-- The very first screen a brand-new visitor sees: nothing to play yet, just a button to begin. -->
<div id="landing" style="display:none; flex-direction:column; align-items:center; gap:14px; max-width:400px; text-align:center;">
  <p>Start a game, then send the link to your opponent. The link stays the same for the whole game — just refresh it to see the other player's move.</p>
  <button id="start-btn">Start new game</button>
  <p><a href="index.html">&larr; Back to all games</a></p>
</div>

<!-- The actual game screen: board on the left, everything else on the right. -->
<div class="layout" id="game-layout" style="display:none;">
  <div id="board-wrap">
    <div id="board"></div>        <!-- the 64 squares get created and inserted here by the script -->
    <div id="drag-ghost"></div>   <!-- the floating piece copy that follows your mouse while dragging -->
  </div>
  <div class="panel">
    <div class="status" id="status"></div> <!-- "White to move", "Checkmate!", etc. gets written in here -->

    <!-- Shows which enemy pieces each color has captured so far -->
    <div class="captured-box">
      <div class="captured-row"><span class="cap-label">White captured:</span><span class="cap-pieces" id="captured-by-white"></span></div>
      <div class="captured-row"><span class="cap-label">Black captured:</span><span class="cap-pieces" id="captured-by-black"></span></div>
    </div>

    <!-- The shareable link box: a read-only text field plus a one-click Copy button -->
    <div class="link-box">
      <label>Send this link to your opponent:</label>
      <div class="link-row">
        <input type="text" id="link-input" readonly>
        <button id="copy-btn">Copy</button>
      </div>
      <div class="copied-msg" id="copied-msg" style="visibility:hidden">Copied!</div>
    </div>

    <!-- Draw / resign / start-a-new-game buttons -->
    <div class="controls">
      <button class="secondary" id="draw-btn">Offer draw</button>
      <button class="danger" id="resign-btn">Resign</button>
      <button class="secondary" id="new-btn">New game</button>
    </div>

    <!-- One-time button to turn on "it's your turn" notifications from the browser -->
    <div class="controls">
      <button class="secondary" id="notify-btn">Enable notifications</button>
    </div>

    <!-- The running list of every move played, in standard chess notation -->
    <div class="history">
      <label style="font-size:0.8rem;color:var(--ink-muted);">Move history</label>
      <ol id="history-list"></ol>
    </div>

    <p style="font-size:0.8rem;"><a href="index.html">&larr; Back to all games</a></p>
  </div>
</div>

<!-- The pop-up asking "which piece should this pawn become?" - only shown at the moment a pawn reaches the far row -->
<div id="promo-modal">
  <div class="box">
    <div>Promote pawn to:</div>
    <div class="choices" id="promo-choices"></div>
  </div>
</div>

<script>
/*
  ============================================================
  THE PROGRAM ITSELF
  ============================================================
  Everything from here down is the actual "brain" of the game: it decides what
  happens when you drag a piece, keeps both players' boards in sync over the
  internet, remembers whose turn it is, and updates all the boxes you see above.

  It's wrapped in "(function () { ... })();" purely as good practice - it keeps
  all of this code's names/variables private to this page, so they can't
  accidentally clash with anything else.
*/
(function () {
  // --------------------------------------------------------
  // Connect to the shared online database (Firebase).
  // This is what lets a move made on one phone/computer instantly show up on
  // the other player's phone/computer - both are just "looking at" the same
  // record in this database at the same time.
  // --------------------------------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyBkjv9MepHUKol6NSf7qNt5i48_1L2JsTM",
    authDomain: "chess-link-6decc.firebaseapp.com",
    databaseURL: "https://chess-link-6decc-default-rtdb.firebaseio.com",
    projectId: "chess-link-6decc",
    storageBucket: "chess-link-6decc.firebasestorage.app",
    messagingSenderId: "939953923414",
    appId: "1:939953923414:web:cc925aa5e4088c8aa1e2f7"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database(); // "db" = our connection to that shared online database

  // The chess piece symbols (these are just text characters, similar to typing an emoji).
  // "w" = White's pieces, "b" = Black's pieces. p/n/b/r/q/k = pawn/knight/bishop/rook/queen/king.
  const PIECE_GLYPHS = {
    w: { p: '♙', n: '♘', b: '♗', r: '♖', q: '♕', k: '♔' },
    b: { p: '♟', n: '♞', b: '♝', r: '♜', q: '♛', k: '♚' }
  };
  const FILES = ['a','b','c','d','e','f','g','h']; // the letters used to name the columns of a chessboard

  // Grabbing references to the boxes/buttons defined in the HTML above, so the code
  // below can read from them or change what's shown inside them.
  const landingEl = document.getElementById('landing');
  const gameLayoutEl = document.getElementById('game-layout');
  const startBtn = document.getElementById('start-btn');
  const boardEl = document.getElementById('board');
  const ghostEl = document.getElementById('drag-ghost');
  const statusEl = document.getElementById('status');
  const linkInput = document.getElementById('link-input');
  const copiedMsg = document.getElementById('copied-msg');
  const historyList = document.getElementById('history-list');
  const promoModal = document.getElementById('promo-modal');
  const promoChoices = document.getElementById('promo-choices');

  // These variables hold "the current state of the game" while the page is open.
  // Think of them as the program's short-term memory.
  let flipped = false;        // should the board be drawn upside-down (so Black's pieces are at the bottom)?
  let chess = new Chess();    // the chess.js "rulebook" object - it always knows the current board position and whose turn it is
  let moveList = [];          // every move played so far, written as short codes like "e2e4" (from square e2, to square e4)
  let lastMoveSquares = null; // which two squares were involved in the most recent move (used to highlight them)
  let gameId = null;          // the unique code identifying this particular game (the part after "#g=" in the link)
  let gameRef = null;         // our live connection to this specific game's data in the online database
  let myColor = null;         // which side THIS browser is playing: 'w' (White), 'b' (Black), or 'spectator' (just watching)
  let gameStatus = null;      // records special game-ending events like a resignation or an agreed draw

  // Makes up a random, unique-enough code to identify a brand new game (used in the shareable link).
  function genGameId() {
    return Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 8);
  }

  // Builds the name used to remember, in this browser only, which color you were assigned for a given game.
  function roleStorageKey(id) {
    return 'chess-link-role-' + id;
  }

  // Figures out whether THIS browser should play White, Black, or just spectate.
  // The very first browser to open a game's link claims White; the second claims Black;
  // anyone after that becomes a spectator (can watch, but not move pieces).
  // This choice is remembered on this device, so refreshing the page won't reassign you.
  async function assignRole(id) {
    const stored = localStorage.getItem(roleStorageKey(id)); // "localStorage" = a small memory box saved on this device only
    if (stored) return stored; // already decided before - just reuse that answer
    let role;
    // "transaction" here is a safe way of saying "claim this seat, but only if nobody already has it" -
    // it prevents two people clicking at the exact same instant from both becoming White.
    const wTx = await db.ref('games/' + id + '/claims/w').transaction(val => val ? undefined : true);
    if (wTx.committed) {
      role = 'w';
    } else {
      const bTx = await db.ref('games/' + id + '/claims/b').transaction(val => val ? undefined : true);
      role = bTx.committed ? 'b' : 'spectator';
    }
    localStorage.setItem(roleStorageKey(id), role); // remember this choice for next time
    return role;
  }

  // --------------------------------------------------------
  // Browser tab title + "it's your turn" notification
  // --------------------------------------------------------
  const BASE_TITLE = 'Link Chess';
  let wasMyTurn = false; // remembers whether it was your turn the last time we checked, so we can notice the moment it *becomes* your turn
  function updateTitle() {
    const myTurn = (myColor === 'w' || myColor === 'b') && chess.turn() === myColor && !gameEnded();
    document.title = myTurn ? '• Your move — ' + BASE_TITLE : BASE_TITLE; // changes the text shown on the browser tab
    if (myTurn && !wasMyTurn) notifyMyTurn(); // only fire a notification at the exact moment your turn begins, not every time we redraw the page
    wasMyTurn = myTurn;
  }

  // Shows a real desktop/phone notification (the kind that pops up outside the browser window)
  // when it becomes your turn, but only if you're not currently looking at the tab, and only if
  // you've previously agreed to allow notifications.
  function notifyMyTurn() {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    if (document.hasFocus()) return; // don't bother notifying if you're already looking at the page
    const n = new Notification('Your move', {
      body: 'It\'s your turn in Link Chess.',
      tag: 'link-chess-turn-' + gameId
    });
    n.onclick = () => { window.focus(); n.close(); }; // clicking the notification jumps you back to this tab
  }

  // Keeps the "Enable notifications" button's text/appearance matching whether permission
  // has been granted, denied, or not yet decided.
  function updateNotifyBtn() {
    const btn = document.getElementById('notify-btn');
    if (!btn) return;
    if (typeof Notification === 'undefined') { btn.style.display = 'none'; return; } // this browser doesn't support notifications at all
    if (Notification.permission === 'granted') {
      btn.textContent = 'Notifications on';
      btn.disabled = true;
    } else if (Notification.permission === 'denied') {
      btn.textContent = 'Notifications blocked';
      btn.disabled = true;
    } else {
      btn.textContent = 'Enable notifications';
      btn.disabled = false;
    }
  }

  // --------------------------------------------------------
  // Sound effects
  // --------------------------------------------------------
  // These sounds aren't audio files - they're generated on the spot using the browser's
  // built-in "Web Audio" feature, like a tiny synthesizer. That's why the game works
  // without downloading anything extra.
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { return null; } // if sound isn't supported for some reason, just skip it quietly
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx;
  }

  // Plays one short musical tone. "freq" is the pitch, "duration" is how long it rings,
  // "type" is the tone quality (like choosing between a smoother or twangier instrument sound).
  function playTone(freq, duration, type, gainPeak) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator(); // the thing that actually produces the pitch
    const gain = ctx.createGain();      // controls how loud it is, and fades it out smoothly instead of cutting off abruptly
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(gainPeak, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }

  // The three distinct sounds used in the game: an ordinary move, a capture, and a check.
  function playMoveSound() { playTone(720, 0.09, 'sine', 0.18); }
  function playCaptureSound() { playTone(280, 0.16, 'triangle', 0.22); }
  function playCheckSound() {
    playTone(520, 0.09, 'sine', 0.2);
    setTimeout(() => playTone(760, 0.12, 'sine', 0.22), 90); // a second note shortly after the first, making a little two-tone "alert"
  }

  // Decides which sound (if any) to play, based on what just happened on the board.
  // It only plays a sound when the move count has actually gone UP since last time we checked,
  // so redrawing the page for other reasons (like just opening it) doesn't make noise.
  let soundMoveCount = null;
  function maybePlayMoveSound() {
    const count = moveList.length;
    if (soundMoveCount === null || count <= soundMoveCount) {
      soundMoveCount = count;
      return;
    }
    soundMoveCount = count;
    if (chess.in_check()) { playCheckSound(); return; }
    const verbose = chess.history({ verbose: true });
    const lastMove = verbose[verbose.length - 1];
    if (lastMove && lastMove.captured) { playCaptureSound(); return; }
    playMoveSound();
  }

  // The short sentence shown in the status box telling you which side you're playing.
  function roleLabel() {
    if (myColor === 'w') return 'You are playing <b>White</b>.';
    if (myColor === 'b') return 'You are playing <b>Black</b>.';
    if (myColor === 'spectator') return 'You are <b>spectating</b> this game.';
    return '';
  }

  // Rebuilds the entire chess position from scratch by replaying every move in order.
  // This runs every time new data arrives from the online database, which is how a
  // move made on one player's screen ends up correctly shown on the other player's screen.
  function rebuildFromMoves(moves) {
    chess = new Chess(); // reset to the starting position
    lastMoveSquares = null;
    for (const mv of moves) {
      // Each stored move is a short code like "e2e4" (or "e7e8q" for a pawn promoting to queen).
      // Here we split that code back apart into "from square", "to square", and optional promotion piece.
      const from = mv.slice(0, 2);
      const to = mv.slice(2, 4);
      const promotion = mv.slice(4, 5) || undefined;
      const res = chess.move({ from, to, promotion });
      if (!res) break; // if a move somehow doesn't make sense, stop rebuilding rather than crash
      lastMoveSquares = { from, to };
    }
    moveList = moves;
  }

  // Builds the exact web address for the current game, so it can be shown in the "share this link" box.
  function currentUrl() {
    const base = window.location.origin + window.location.pathname;
    return base + '#g=' + gameId;
  }

  // Updates the shareable-link text box, and quietly updates the address bar to match
  // (without actually reloading the page).
  function updateUrlBar() {
    const url = currentUrl();
    linkInput.value = url;
    history.replaceState(null, '', url);
  }

  // Connects this browser to one specific game's data in the online database, and figures out
  // which color you'll be playing. From this point on, ANY time someone (you or your opponent)
  // makes a move, this code automatically re-runs and redraws the board - that's the "live sync" magic.
  async function attachGameListener(id) {
    if (gameRef) gameRef.off(); // stop listening to any previous game first, if we were already watching one
    gameId = id;
    soundMoveCount = null;
    myColor = await assignRole(id);
    flipped = myColor === 'b'; // if you're Black, draw the board upside-down so your pieces are at the bottom
    gameRef = db.ref('games/' + gameId);
    gameRef.on('value', (snapshot) => {
      // This block runs automatically every time the game's data changes in the database -
      // including the very first time we connect, and again every time either player moves.
      const data = snapshot.val();
      const moves = (data && data.moves) ? data.moves : [];
      gameStatus = (data && data.status) ? data.status : null;
      rebuildFromMoves(moves);
      render(); // redraw everything on screen to match the latest data
    });
  }

  // Creates a brand new game: makes up a game ID, saves an empty game to the database,
  // marks yourself as White, and starts watching that game.
  async function startNewGame() {
    const id = genGameId();
    await db.ref('games/' + id).set({ moves: [], claims: { w: true } });
    localStorage.setItem(roleStorageKey(id), 'w');
    await attachGameListener(id);
    showGame();
  }

  // Switches from the "Start new game" screen to the actual board+panel screen.
  function showGame() {
    landingEl.style.display = 'none';
    gameLayoutEl.style.display = 'flex';
  }

  // Switches back to the "Start new game" screen (used when the page is opened with no game link).
  function showLanding() {
    landingEl.style.display = 'flex';
    gameLayoutEl.style.display = 'none';
  }

  // Turns a column number (0-7) and row number (1-8) into a standard chess square name like "e4".
  function squareId(file, rank) {
    return FILES[file] + rank;
  }

  // Draws the entire 8x8 board from scratch: every square, its color, any highlights,
  // the little coordinate labels, and any piece sitting on it. This function is called
  // any time something changes and the board needs to be redrawn.
  function renderBoard() {
    boardEl.innerHTML = ''; // clear out the old board completely before drawing the new one
    const turn = chess.turn(); // whose turn is it right now: 'w' or 'b'
    for (let r = 0; r < 8; r++) {
      for (let f = 0; f < 8; f++) {
        // Figures out which real chess square (like "e4") belongs in this grid position,
        // accounting for whether the board is flipped (Black's view) or not (White's view).
        const rank = flipped ? (r + 1) : (8 - r);
        const file = flipped ? (7 - f) : f;
        const sq = squareId(file, rank);
        const sqEl = document.createElement('div');
        sqEl.className = 'square ' + (((file + rank) % 2 === 0) ? 'dark' : 'light'); // alternates light/dark in the classic checkerboard pattern
        sqEl.dataset.square = sq; // tags this square's HTML element with its chess name, so later code can find it by name
        if (lastMoveSquares && (sq === lastMoveSquares.from || sq === lastMoveSquares.to)) {
          sqEl.classList.add('last-move'); // tints the two squares involved in the most recent move
        }
        // Add the small "a-h" letter labels along the bottom edge and "1-8" number labels along the left edge
        if (file === 0) {
          const rc = document.createElement('div');
          rc.className = 'coord rank';
          rc.textContent = rank;
          sqEl.appendChild(rc);
        }
        if (rank === 1) {
          const fc = document.createElement('div');
          fc.className = 'coord file';
          fc.textContent = FILES[file];
          sqEl.appendChild(fc);
        }
        // If there's a piece sitting on this square, draw its symbol on top
        const piece = chess.get(sq);
        if (piece) {
          const pEl = document.createElement('div');
          pEl.className = 'piece ' + (piece.color === 'w' ? 'white' : 'black');
          pEl.textContent = PIECE_GLYPHS[piece.color][piece.type];
          pEl.dataset.square = sq;
          // A piece can only be picked up if: it's that piece's own color's turn, AND
          // it belongs to the color YOU are playing, AND the game hasn't already ended.
          const draggable = piece.color === turn && piece.color === myColor && !chess.game_over() && !gameEnded();
          if (!draggable) pEl.classList.add('locked'); // pieces you can't move get a plain, non-clickable look
          sqEl.appendChild(pEl);
        }
        boardEl.appendChild(sqEl);
      }
    }
  }

  // Removes all the "you can move here" dots and the "picked up from here" highlight from the board.
  function clearHighlights() {
    document.querySelectorAll('.square .dot').forEach(d => d.remove());
    document.querySelectorAll('.square.highlight').forEach(s => s.classList.remove('highlight'));
  }

  // When you pick up a piece, this draws a dot on every square that piece is legally allowed to move to
  // (a bigger ring instead of a dot if that move would capture an enemy piece).
  function showLegalMoves(square) {
    clearHighlights();
    const origin = document.querySelector('.square[data-square="' + square + '"]');
    if (origin) origin.classList.add('highlight');
    const moves = chess.moves({ square, verbose: true }); // ask chess.js: "what are all the legal moves from this square?"
    for (const mv of moves) {
      const targetEl = document.querySelector('.square[data-square="' + mv.to + '"]');
      if (!targetEl) continue;
      const dot = document.createElement('div');
      dot.className = 'dot' + (mv.flags.includes('c') || mv.flags.includes('e') ? ' capture' : '');
      targetEl.appendChild(dot);
    }
  }

  // Given a raw pixel position on the screen (like where your finger let go), figures out
  // which chess square, if any, that position is over.
  function squareFromPoint(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const sqEl = el.closest('.square');
    return sqEl ? sqEl.dataset.square : null;
  }

  // True if the game is over for ANY reason - a normal chess ending (checkmate/stalemate/etc.)
  // or someone resigning, or both sides agreeing to a draw.
  function gameEnded() {
    return chess.game_over() || (gameStatus && (gameStatus.type === 'resign' || gameStatus.type === 'draw'));
  }

  // Turns the single-letter color code ('w' or 'b') into the full word "White" or "Black".
  function colorName(c) {
    return c === 'w' ? 'White' : 'Black';
  }

  // Works out exactly what sentence should appear in the status box at any given moment -
  // whose turn it is, whether someone's in check, or how the game ended if it has.
  function statusText() {
    if (gameStatus && gameStatus.type === 'resign') {
      const winner = gameStatus.by === 'w' ? 'Black' : 'White';
      return '<b>' + colorName(gameStatus.by) + ' resigned.</b> ' + winner + ' wins.';
    }
    if (gameStatus && gameStatus.type === 'draw') {
      return '<b>Draw</b> agreed.';
    }
    if (chess.in_checkmate()) {
      const winner = chess.turn() === 'w' ? 'Black' : 'White';
      return '<b>Checkmate!</b> ' + winner + ' wins.';
    }
    if (chess.in_stalemate()) return '<b>Stalemate.</b> Draw.';
    if (chess.in_threefold_repetition()) return '<b>Draw</b> by threefold repetition.';
    if (chess.in_draw()) return '<b>Draw</b> (50-move rule or insufficient material).';
    const side = chess.turn() === 'w' ? 'White' : 'Black';
    const check = chess.in_check() ? ' — <b>Check!</b>' : '';
    let text = '<b>' + side + '</b> to move' + check + '.';
    if (gameStatus && gameStatus.type === 'drawOffer' && gameStatus.by !== myColor) {
      text += ' ' + colorName(gameStatus.by) + ' offered a draw.';
    }
    return text;
  }

  // Rewrites the "Move history" list to show every move played, in standard chess notation
  // (things like "e4", "Nf3", "O-O" for castling, etc. - the same shorthand used in chess books).
  function renderHistory() {
    historyList.innerHTML = '';
    const verbose = chess.history({ verbose: true });
    verbose.forEach((mv, i) => {
      const li = document.createElement('li');
      li.textContent = (i % 2 === 0 ? '' : '') + mv.san;
      historyList.appendChild(li);
    });
  }

  // Figures out which pieces each side has captured over the course of the game, and
  // displays them (sorted, roughly biggest/most-valuable first) in the captured-pieces box.
  function renderCaptured() {
    const captured = { w: [], b: [] };
    chess.history({ verbose: true }).forEach(mv => {
      if (mv.captured) {
        const capturingColor = mv.color;
        captured[capturingColor].push(mv.captured);
      }
    });
    const order = { q: 0, r: 1, b: 2, n: 3, p: 4 }; // queen first, then rook, bishop, knight, pawn last
    const sortAndRender = (list, byColor) => list
      .slice()
      .sort((a, b) => order[a] - order[b])
      .map(type => PIECE_GLYPHS[byColor === 'w' ? 'b' : 'w'][type]) // show the OPPONENT's piece symbol, since that's whose piece got captured
      .join(' ');
    document.getElementById('captured-by-white').textContent = sortAndRender(captured.w, 'w');
    document.getElementById('captured-by-black').textContent = sortAndRender(captured.b, 'b');
  }

  // Updates the Resign/Offer-draw buttons: hides them entirely for spectators or once the
  // game has ended, and changes "Offer draw" to "Accept draw" if your opponent already offered one.
  function renderControls() {
    const drawBtn = document.getElementById('draw-btn');
    const resignBtn = document.getElementById('resign-btn');
    const canAct = (myColor === 'w' || myColor === 'b') && !gameEnded();
    drawBtn.style.display = canAct ? '' : 'none';
    resignBtn.style.display = canAct ? '' : 'none';
    if (!canAct) return;
    if (gameStatus && gameStatus.type === 'drawOffer' && gameStatus.by !== myColor) {
      drawBtn.textContent = 'Accept draw';
    } else {
      drawBtn.textContent = 'Offer draw';
    }
  }

  // The main "redraw everything" function. Whenever the game state changes for any reason
  // (you moved, your opponent moved, someone resigned, etc.), this one function is called
  // to bring every part of the page up to date at once.
  function render() {
    renderBoard();
    statusEl.innerHTML = roleLabel() + '<br>' + statusText();
    renderHistory();
    renderCaptured();
    renderControls();
    updateUrlBar();
    updateTitle();
    updateNotifyBtn();
    maybePlayMoveSound();
  }

  // Actually plays a move: checks it's legal, updates the board, redraws the screen,
  // and sends the move to the online database so your opponent's screen updates too.
  function commitMove(from, to, promotion) {
    const res = chess.move({ from, to, promotion });
    if (!res) return false; // chess.js rejected this as an illegal move
    moveList.push(from + to + (promotion || '')); // store the move as a short code, e.g. "e2e4"
    lastMoveSquares = { from, to };
    render();
    gameRef.child('moves').set(moveList); // send the updated move list to the shared database
    if (gameStatus && gameStatus.type === 'drawOffer') {
      gameRef.child('status').remove(); // making a move instead of accepting counts as declining a pending draw offer
    }
    return true;
  }

  // Checks whether a move would be a pawn reaching the very last row - if so, the player
  // needs to choose what it becomes (Queen, Rook, Bishop, or Knight) before the move can complete.
  function needsPromotion(from, to) {
    const piece = chess.get(from);
    if (!piece || piece.type !== 'p') return false;
    const destRank = to[1];
    return (piece.color === 'w' && destRank === '8') || (piece.color === 'b' && destRank === '1');
  }

  // Shows the pawn-promotion pop-up with four piece choices, and runs "callback" (continues
  // the move) once the player clicks one of them.
  function askPromotion(color, callback) {
    promoChoices.innerHTML = '';
    ['q', 'r', 'b', 'n'].forEach(type => {
      const btn = document.createElement('button');
      btn.textContent = PIECE_GLYPHS[color][type];
      btn.className = 'secondary';
      btn.addEventListener('click', () => {
        promoModal.style.display = 'none';
        callback(type);
      });
      promoChoices.appendChild(btn);
    });
    promoModal.style.display = 'flex';
  }

  // --------------------------------------------------------
  // Drag-and-drop handling
  // --------------------------------------------------------
  // This section listens for mouse clicks / finger touches on the board and turns them
  // into "pick up this piece, drag it, drop it here" actions. "Pointer" events work for
  // both a mouse and a touchscreen finger, so the same code handles computers and phones.
  let dragState = null; // remembers which piece is currently being dragged, if any

  // Runs the instant you press down on a piece: picks it up (visually) and shows where it can legally go.
  function onPointerDown(e) {
    const pieceEl = e.target.closest('.piece');
    if (!pieceEl || pieceEl.classList.contains('locked')) return; // ignore clicks that aren't on a piece you're allowed to move
    const from = pieceEl.dataset.square;
    e.preventDefault();
    dragState = { from, pieceEl, glyph: pieceEl.textContent, color: pieceEl.classList.contains('white') ? 'white' : 'black' };
    pieceEl.classList.add('dragging'); // fades the real piece out
    ghostEl.textContent = dragState.glyph;
    ghostEl.className = 'piece ' + dragState.color;
    ghostEl.style.display = 'block'; // shows the floating "ghost" copy instead
    moveGhost(e.clientX, e.clientY);
    showLegalMoves(from);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
  }

  // Moves the floating ghost piece to a specific pixel position on screen.
  function moveGhost(x, y) {
    ghostEl.style.left = x + 'px';
    ghostEl.style.top = y + 'px';
  }

  // Runs continuously while dragging, keeping the ghost piece stuck to the mouse/finger.
  function onPointerMove(e) {
    if (!dragState) return;
    moveGhost(e.clientX, e.clientY);
  }

  // Runs the instant you let go: figures out which square you dropped on, checks whether
  // that's a legal move, and either completes the move or (if it was illegal) just cancels the drag.
  function onPointerUp(e) {
    if (!dragState) return;
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    ghostEl.style.display = 'none';
    dragState.pieceEl.classList.remove('dragging');
    clearHighlights();

    const to = squareFromPoint(e.clientX, e.clientY);
    const from = dragState.from;
    dragState = null;
    if (!to || to === from) return; // dropped outside the board, or dropped back on the same square - do nothing

    const legal = chess.moves({ square: from, verbose: true }).some(m => m.to === to);
    if (!legal) return; // not a legal move - the piece silently snaps back to where it started

    if (needsPromotion(from, to)) {
      const piece = chess.get(from);
      askPromotion(piece.color, (type) => commitMove(from, to, type)); // ask which piece to promote to, then complete the move
    } else {
      commitMove(from, to);
    }
  }

  boardEl.addEventListener('pointerdown', onPointerDown); // this line is what actually "turns on" all the drag-and-drop behavior above

  // --------------------------------------------------------
  // Button click handlers
  // --------------------------------------------------------
  // Everything below just says "when this specific button is clicked, do this."

  document.getElementById('new-btn').addEventListener('click', () => {
    if (!confirm('Start a brand new game? This creates a fresh link.')) return; // asks for confirmation first, since this abandons the current game
    flipped = false;
    startNewGame();
  });

  startBtn.addEventListener('click', startNewGame); // the big "Start new game" button on the very first screen

  document.getElementById('notify-btn').addEventListener('click', async () => {
    if (typeof Notification === 'undefined') return;
    await Notification.requestPermission(); // this is what actually triggers the browser's "Allow notifications?" prompt
    updateNotifyBtn();
  });

  document.getElementById('resign-btn').addEventListener('click', () => {
    if (myColor !== 'w' && myColor !== 'b') return; // spectators can't resign a game they're not playing in
    if (!confirm('Are you sure you want to resign?')) return;
    gameRef.child('status').set({ type: 'resign', by: myColor }); // tells the database (and therefore the other player) that you resigned
  });

  document.getElementById('draw-btn').addEventListener('click', () => {
    if (myColor !== 'w' && myColor !== 'b') return;
    if (gameStatus && gameStatus.type === 'drawOffer' && gameStatus.by !== myColor) {
      // your opponent already offered a draw, and you just clicked "Accept draw"
      gameRef.child('status').set({ type: 'draw' });
    } else {
      // nobody has offered yet - record that YOU are now offering one
      gameRef.child('status').set({ type: 'drawOffer', by: myColor });
    }
  });

  document.getElementById('copy-btn').addEventListener('click', async () => {
    const url = linkInput.value;
    try {
      await navigator.clipboard.writeText(url); // the modern, preferred way to copy text to the clipboard
      flashCopied();
    } catch (err) {
      // Some browsers/situations block the method above, so this is a fallback: select the
      // text in the box and use the older copy command instead.
      linkInput.select();
      try {
        document.execCommand('copy');
        flashCopied();
      } catch (err2) {
        alert('Copy failed — please select the text and copy manually.');
      }
    }
  });

  // Briefly shows the "Copied!" message after a successful copy, then hides it again after 1.5 seconds.
  function flashCopied() {
    copiedMsg.style.visibility = 'visible';
    setTimeout(() => { copiedMsg.style.visibility = 'hidden'; }, 1500);
  }

  // --------------------------------------------------------
  // Start-up: what happens the moment the page loads
  // --------------------------------------------------------
  // Looks at the page's own address to see if it already contains a game to join
  // (something like "...#g=abc123"). If so, jump straight into that game. If not,
  // show the "Start new game" screen instead.
  function init() {
    const hash = window.location.hash.replace(/^#/, '');
    const params = new URLSearchParams(hash);
    const g = params.get('g');
    if (g) {
      attachGameListener(g);
      showGame();
    } else {
      showLanding();
    }
  }

  init(); // this line is what actually kicks everything off when the page first opens
})();
</script>
</body>
</html>
